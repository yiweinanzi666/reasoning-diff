[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-diff"
version = "0.1.0"
description = "Auditable premise-dependency experiments on reasoning models"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
model = ["torch>=2.6,<3", "transformers>=5.5,<6", "accelerate>=1.2,<2", "safetensors>=0.4", "sentencepiece>=0.2"]
datasets = ["datasets>=3,<5"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
reasoning-diff = "reasoning_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: local tiny randomly initialized model tests, no downloaded weights"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
